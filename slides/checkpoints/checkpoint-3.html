<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint 3 | 動力學結構速查</title>
  <link rel="stylesheet" href="checkpoint.css">
</head>
<body data-checkpoint="3">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="mark">03</div><span>Sussillo CTD Interactive Questions</span></div>
      <nav class="navlinks" aria-label="checkpoint navigation">
        <a href="checkpoint-1.html">01</a>
        <a href="checkpoint-2.html">02</a>
        <a class="active" href="checkpoint-3.html">03</a>
        <a href="checkpoint-4.html">04</a>
        <a href="checkpoint-5.html">05</a>
      </nav>
    </header>
    <section class="layout">
      <article class="quiz-card">
        <div class="kicker">CHECK-POINT 3 · 投票 + 對照</div>
        <h1>動力學結構速查</h1>
        <p class="prompt">環形記憶 (heading direction) 最適合用哪個 motif?</p>
        <div class="question-label">SELECT ONE</div>
        <div class="options" role="list">
          <button class="option" data-option="A"><span class="letter">A</span><span class="option-text">點吸引子</span></button>
          <button class="option" data-option="B"><span class="letter">B</span><span class="option-text">線吸引子</span></button>
          <button class="option" data-option="C"><span class="letter">C</span><span class="option-text">環吸引子</span></button>
          <button class="option" data-option="D"><span class="letter">D</span><span class="option-text">極限環</span></button>
        </div>
        <div class="actions">
          <button class="primary" data-submit disabled>送出答案</button>
          <button class="secondary" data-reset>重新作答</button>
        </div>
        <div class="feedback" data-feedback>
          <strong data-feedback-title></strong>
          <div data-feedback-body></div>
        </div>
        <div class="pager">
          <a href="checkpoint-2.html">上一題</a>
          <a href="checkpoint-4.html">下一題</a>
        </div>
      </article>
      <aside class="side-panel">
        <div class="visual">
          <svg viewBox="0 0 420 300" role="img" aria-label="ring attractor for heading direction">
            <rect width="420" height="300" fill="#11161d"/>
            <circle cx="210" cy="150" r="88" fill="none" stroke="#22d3ee" stroke-width="7" opacity=".85"/>
            <circle cx="210" cy="150" r="42" fill="none" stroke="#a78bfa" stroke-width="1.5" opacity=".55"/>
            <path d="M210 150 L269 85" stroke="#f59e0b" stroke-width="4"/>
            <circle cx="269" cy="85" r="10" fill="#f59e0b"/>
            <g fill="#10b981">
              <circle cx="210" cy="62" r="5"/><circle cx="298" cy="150" r="5"/><circle cx="210" cy="238" r="5"/><circle cx="122" cy="150" r="5"/>
            </g>
            <text x="210" y="34" fill="#f1f5f9" font-size="17" text-anchor="middle" font-weight="700">closed one-dimensional manifold</text>
            <text x="210" y="274" fill="#94a3b8" font-size="13" text-anchor="middle">0 to 360 degrees live on a ring</text>
          </svg>
        </div>
        <div class="note-box">
          <h2>motif 對應</h2>
          <p>點吸引子適合離散狀態,線吸引子適合連續量,環吸引子適合週期性的連續變量。</p>
        </div>
      </aside>
    </section>
  </main>
  <script src="checkpoint.js"></script>
</body>
</html>

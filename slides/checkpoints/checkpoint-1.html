<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Checkpoint 1 | 訓練混沌 RNN</title>
  <link rel="stylesheet" href="checkpoint.css">
</head>
<body data-checkpoint="1">
  <main class="app-shell">
    <header class="topbar">
      <div class="brand"><div class="mark">01</div><span>Sussillo CTD Interactive Questions</span></div>
      <nav class="navlinks" aria-label="checkpoint navigation">
        <a class="active" href="checkpoint-1.html">01</a>
        <a href="checkpoint-2.html">02</a>
        <a href="checkpoint-3.html">03</a>
        <a href="checkpoint-4.html">04</a>
        <a href="checkpoint-5.html">05</a>
      </nav>
    </header>
    <section class="layout">
      <article class="quiz-card">
        <div class="kicker">CHECK-POINT 1 · 投票</div>
        <h1>訓練混沌 RNN 為什麼難?</h1>
        <p class="prompt">請選擇你認為的主因。</p>
        <div class="question-label">SELECT ONE</div>
        <div class="options" role="list">
          <button class="option" data-option="A"><span class="letter">A</span><span class="option-text">梯度爆炸 (Exploding gradient)</span></button>
          <button class="option" data-option="B"><span class="letter">B</span><span class="option-text">梯度消失 (Vanishing gradient)</span></button>
          <button class="option" data-option="C"><span class="letter">C</span><span class="option-text">反饋路徑被混沌放大,不穩定</span></button>
          <button class="option" data-option="D"><span class="letter">D</span><span class="option-text">以上皆是</span></button>
        </div>
        <div class="actions">
          <button class="primary" data-submit disabled>送出答案</button>
          <button class="secondary" data-reset>重新作答</button>
        </div>
        <div class="feedback" data-feedback>
          <strong data-feedback-title></strong>
          <div data-feedback-body></div>
        </div>
        <div class="pager">
          <a href="index.html">題目總覽</a>
          <a href="checkpoint-2.html">下一題</a>
        </div>
      </article>
      <aside class="side-panel">
        <div class="visual">
          <svg viewBox="0 0 420 300" role="img" aria-label="chaotic recurrent neural network diagram">
            <rect width="420" height="300" fill="#11161d"/>
            <g fill="#a78bfa" opacity=".86">
              <circle cx="122" cy="112" r="5"/><circle cx="166" cy="82" r="5"/><circle cx="214" cy="104" r="5"/>
              <circle cx="116" cy="174" r="5"/><circle cx="184" cy="156" r="5"/><circle cx="244" cy="176" r="5"/>
              <circle cx="150" cy="224" r="5"/><circle cx="226" cy="232" r="5"/>
            </g>
            <g fill="none" stroke="#a78bfa" stroke-width="1.4" opacity=".42">
              <path d="M122 112 C160 40 230 50 244 176"/><path d="M116 174 C190 250 260 230 214 104"/>
              <path d="M166 82 C120 130 120 200 226 232"/><path d="M244 176 C300 112 260 72 166 82"/>
            </g>
            <path d="M270 154 C310 132 338 132 364 154 C337 177 307 176 270 154Z" fill="none" stroke="#10b981" stroke-width="3"/>
            <path d="M318 132 L318 82" stroke="#10b981" stroke-width="3"/>
            <text x="210" y="42" fill="#f1f5f9" font-size="17" text-anchor="middle" font-weight="700">feedback is part of the dynamics</text>
            <text x="210" y="272" fill="#94a3b8" font-size="13" text-anchor="middle">RLS corrects output error at every step</text>
          </svg>
        </div>
        <div class="note-box">
          <h2>FORCE 的核心</h2>
          <p>不要拔掉反饋路徑,而是在系統運轉時即時調整輸出權重,讓混沌 RNN 產生穩定目標軌跡。</p>
        </div>
      </aside>
    </section>
  </main>
  <script src="checkpoint.js"></script>
</body>
</html>
